<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manual Exchange Tests</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}?v={{ static_version }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v={{ static_version }}" />
  {% set settings = settings or {} %}
  {% set analysis_exchanges = settings.get('analysis_exchanges', {}) %}
  <script defer src="{{ url_for('static', path='/manual_tests.js') }}?v={{ static_version }}"></script>
</head>
<body class="page">
  <header class="masthead">
    <div>
      <h1>Manual Exchange Tests</h1>
      <p class="subtitle">Place/cancel test orders per exchange (perps only).</p>
    </div>
    <div class="status-block">
      <dl>
        <div>
          <dt>Mode</dt>
          <dd>Diagnostics</dd>
        </div>
        <div>
          <dt>Hint</dt>
          <dd>Use small sizes; limit orders default below/above market.</dd>
        </div>
      </dl>
      <a class="button" href="/manual">Back to manual</a>
    </div>
  </header>

  <main class="content">
    <section class="panel">
      <h2>Order test</h2>
      <form id="manual-test-form" class="analysis-form">
        <label>
          Exchange
          <select id="test-exchange">
            {% for name, enabled in analysis_exchanges.items() %}
              {% if enabled %}<option value="{{ name }}">{{ name|upper }}</option>{% endif %}
            {% endfor %}
          </select>
        </label>
        <label>
          Symbol
          <input type="text" id="test-symbol" placeholder="BTC or BTCUSDT" autocomplete="off" />
        </label>
        <label>
          Side
          <select id="test-side">
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
          </select>
        </label>
        <label>
          Qty (base)
          <input type="number" id="test-qty" step="0.0001" min="0" />
        </label>
        <label>
          Limit price (optional)
          <input type="number" id="test-price" step="0.0001" min="0" />
        </label>
        <label>
          Offset (bps)
          <input type="number" id="test-offset-bps" step="1" min="0" value="50" />
        </label>
        <label>
          Offset (ticks)
          <input type="number" id="test-offset-ticks" step="1" min="0" value="0" />
        </label>
        <label>
          Margin mode
          <select id="test-margin-mode">
            <option value="isolated" selected>Isolated</option>
            <option value="cross">Cross</option>
          </select>
        </label>
        <label class="settings-checkbox">
          <input type="checkbox" id="test-reduce-only" />
          Reduce only
        </label>
        <label>
          Position side (optional)
          <input type="text" id="test-position-side" placeholder="long/short/net" autocomplete="off" />
        </label>
        <label>
          Order id (cancel)
          <input type="text" id="test-order-id" placeholder="last order id" autocomplete="off" />
        </label>
        <div class="settings-intervals">
          <button type="button" class="button" id="test-limit">Place limit</button>
          <button type="button" class="button" id="test-market">Place market</button>
          <button type="button" class="button" id="test-cancel">Cancel order</button>
          <span class="settings-status" id="test-status" aria-live="polite"></span>
        </div>
      </form>
      <div class="panel-muted">
        <pre id="test-result" class="code-block"></pre>
      </div>
    </section>
  </main>
</body>
</html>
